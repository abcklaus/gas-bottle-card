name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the card version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n 's/.*CARD_VERSION = "\(.*\)".*/\1/p' dist/gas-bottle-card.js)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CARD_VERSION $VERSION" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/gas-bottle-card.js
          generate_release_notes: true
